repositories {
    google()
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

configurations {
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'org.apache.httpcomponents', module: 'httpclient'
    }
}

apply plugin: 'com.android.application'

// Release signing. The key and its passwords live in keystore.properties, which is
// deliberately kept out of git: losing control of them means someone else can ship
// updates that phones accept as genuine. Without that file the build falls back to
// the debug key, so a fresh clone still builds - it just cannot be published.
// Parsed by hand rather than with java.util.Properties: naming JDK classes here
// makes Groovy load them, and the JDK shipped with Android Studio is newer than
// this Gradle can read, which fails the build before it starts.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def hasReleaseKey = keystorePropertiesFile.exists()
def keystoreProperties = [:]
if (hasReleaseKey) {
    keystorePropertiesFile.eachLine { line ->
        def trimmed = line.trim()
        def sep = trimmed.indexOf('=')
        if (sep > 0 && !trimmed.startsWith('#')) {
            keystoreProperties[trimmed.substring(0, sep).trim()] = trimmed.substring(sep + 1).trim()
        }
    }
}

android {
    namespace = 'io.github.mpstudios56.cifra'
    compileSdk = 36

    defaultConfig {
        applicationId "io.github.mpstudios56.cifra"
        minSdkVersion 23
        targetSdkVersion 36
        multiDexEnabled = true

        testApplicationId "io.github.mpstudios56.cifra.test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                argument "androidManifestFile", "$projectDir/src/main/AndroidManifest.xml".toString()
                argument "logLevel", "TRACE"
                argument "logAppenderConsole", "true"
                argument "eventBusIndex", "io.github.mpstudios56.cifra.MyEventBusIndex"
            }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt', 'proguard-google-api-client.txt'
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        // A second copy of the test build, side by side with the first.
        //
        // Sharing works through a folder, so two installations pointing at the
        // same folder exchange with each other whether or not they are on the
        // same phone. Testing it used to mean two phones and a wait for the
        // store to look the build over; with this it takes one phone and a
        // minute. Debug-signed like the other, and never published.
        debugTwo {
            initWith debug
            applicationIdSuffix ".dev2"
            versionNameSuffix "-dev2"
            matchingFallbacks = ['debug']
        }
    }
    packagingOptions {
        pickFirst 'META-INF/LICENSE'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/INDEX.LIST'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        buildConfig = true
    }
}

final SUPPORT_LIB_VER = '27.0.2'
